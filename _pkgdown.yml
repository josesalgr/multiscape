reference:

  # ---------------------------------------------------------------------------
  # PROBLEM DEFINITION
  # ---------------------------------------------------------------------------

  - title: "Create a planning problem"
    desc: >
      Create the core planning problem from planning units, features, costs,
      and optional spatial data.
    contents:
      - create_problem

  - title: "Management actions and outcomes"
    desc: >
      Define feasible management actions and their ecological and economic
      consequences.
    contents:
      - add_actions
      - add_action_sets
      - get_action_sets
      - add_effects
      - add_benefits
      - add_losses
      - add_profit

  - title: "Targets and constraints"
    desc: >
      Specify representation targets, resource limits, and fixed planning-unit
      or action decisions.
    contents:
      - add_constraint_targets_absolute
      - add_constraint_targets_relative
      - add_constraint_area
      - add_constraint_budget
      - add_constraint_action_cardinality
      - add_constraint_action_requires
      - add_constraint_action_excludes
      - add_constraint_action_together
      - add_constraint_locked_actions
      - add_constraint_locked_planning_units

  - title: "Spatial relationships"
    desc: >
      Define and store neighborhood, boundary, distance, and user-supplied
      relationships among planning units.
    contents:
      - add_spatial_relations
      - add_spatial_boundary
      - add_spatial_rook
      - add_spatial_queen
      - add_spatial_knn
      - add_spatial_distance

  - title: "Atomic objectives"
    desc: >
      Add ecological, economic, and spatial objectives to the
      planning problem.
    contents:
      - add_objective_min_cost
      - add_objective_max_effect
      - add_objective_min_effect
      - add_objective_max_profit
      - add_objective_max_net_profit
      - add_objective_min_fragmentation_planning_units
      - add_objective_min_fragmentation_action


  # ---------------------------------------------------------------------------
  # OPTIMIZATION
  # ---------------------------------------------------------------------------

  - title: "Multi-objective methods and run designs"
    desc: >
      Choose how multiple objectives are explored and define the combinations
      of weights or constraints to evaluate.
    contents:
      - set_method_weighted_sum
      - set_method_epsilon_constraint
      - set_method_augmecon
      - set_runs_grid
      - set_runs_manual
      - set_runs_control

  - title: "Solvers and optimization"
    desc: >
      Select and configure a mixed-integer programming solver, then solve the
      planning problem.
    contents:
      - set_solver
      - set_solver_gurobi
      - set_solver_cplex
      - set_solver_cbc
      - set_solver_symphony
      - solve


  # ---------------------------------------------------------------------------
  # SOLUTIONS AND ANALYSIS
  # ---------------------------------------------------------------------------

  - title: "Inspect solutions"
    desc: >
      Extract run metadata, objective values, spatial decisions, features,
      and target outcomes from stored solutions.
    contents:
      - get_runs
      - get_objectives
      - get_planning_units
      - get_actions
      - get_solution_states
      - get_features
      - get_targets

  - title: "Manage solution sets"
    desc: >
      Filter, combine, and remove duplicate alternatives before analysis or
      reporting.
    contents:
      - solution_filter
      - solution_append
      - solution_unique

  - title: "Objective-space analysis"
    desc: >
      Characterize performance trade-offs, empirical extremes, distances,
      knees, and neighboring alternatives in objective space.
    contents:
      - frontier_extremes
      - frontier_distances
      - frontier_knee
      - frontier_neighbors

  - title: "Decision-space analysis"
    desc: >
      Quantify recurrence, similarity, and consistency in spatial decisions
      across alternative solutions.
    contents:
      - selection_frequency
      - selection_similarity
      - selection_consistency

  - title: "Objective-decision linkage"
    desc: >
      Relate changes in objective performance to changes in spatial
      prescriptions and identify informative solution contrasts.
    contents:
      - linkage_distances
      - linkage_transition
      - linkage_turnover
      - linkage_contrasts

  - title: "Visualize results"
    desc: >
      Plot objective trade-offs, planning-unit selections, management actions,
      and spatial feature distributions.
    contents:
      - plot_tradeoff
      - plot_spatial_planning_units
      - plot_spatial_actions
      - plot_spatial_features


  # ---------------------------------------------------------------------------
  # PACKAGE INFRASTRUCTURE
  # ---------------------------------------------------------------------------

  - title: "Core objects"
    desc: >
      Classes used to represent planning problems and their resulting solution
      sets.
    contents:
      - problem-class
      - solutionset-class

  - title: "Advanced model inspection"
    desc: >
      Compile and inspect the underlying optimization model.
    contents:
      - compile_model

  - title: "Example data"
    desc: >
      Simulated datasets and data loaders used in package examples and
      documentation.
    contents:
      - starts_with("sim_")
      - load_sim_features_raster
      - load_sim_multiaction

  - title: "Deprecated functions"
    desc: >
      Functions retained temporarily for backward compatibility.
    contents:
      - add_objective_max_benefit
      - add_objective_min_loss
      - add_objective_min_intervention_impact
      - add_constraint_locked_pu
      - add_objective_min_fragmentation_pu
      - get_pu
      - plot_spatial_pu
      - run_grid
      - run_manual
      - mo_control
